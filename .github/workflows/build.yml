# Tests and builds the app for every system on every push. Each installer is kept as an artifact of the run on its
# own, not zipped: a .dmg for macOS, the installers and a zip of the command-line tool for Windows and Linux.
# Pushing a tag such as v0.1.0 also attaches them to a DRAFT release, published by hand on GitHub.
# Nothing here signs the apps for macOS or Windows (see README.md, "Unsigned builds"). The update files are signed
# for the app's own updater (.github/sign.sh, with the secret TAURI_SIGNING_PRIVATE_KEY), and a release also gets
# latest.json, which the app reads on opening to find a newer version (.github/latest_json.py).
#
# File names: Registro-de-equipos_<version>_<system>-<architecture>.<extension>. <version> is the tag's version for
# releases (0.1.0), otherwise Cargo.toml's version and the run number (0.1.0-build.12).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p inventario-core
      - name: The app's update check (macOS only; Linux would need the window libraries)
        if: runner.os == 'macOS'
        run: cargo test -p inventario-registro
      - name: What this runner reports about itself
        run: cargo run -q -p inventario-registro-cli -- --dry-run

  macos:
    name: macOS (universal)
    needs: test
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Version for file names
        run: echo "LABEL=$(bash .github/label.sh)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
        working-directory: app
      - run: npx tauri build --target universal-apple-darwin --bundles app,dmg
        working-directory: app
      - name: Collect the files
        run: |
          mkdir -p dist
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg "dist/Registro-de-equipos_${LABEL}_macos-universal.dmg"
          # what the updater installs: the app itself, compressed
          tar -czf "dist/Registro-de-equipos_${LABEL}_macos-universal.app.tar.gz" -C target/universal-apple-darwin/release/bundle/macos "Registro de equipos.app"
      - name: Sign the update file
        run: bash .github/sign.sh "dist/Registro-de-equipos_${LABEL}_macos-universal.app.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          path: dist/Registro-de-equipos_${{ env.LABEL }}_macos-universal.dmg
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: dist/Registro-de-equipos_${{ env.LABEL }}_macos-universal.app.tar.gz
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: signatures-macos
          path: dist/*.sig
          if-no-files-found: ignore

  windows:
    name: Windows (${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - arch: arm64
            target: aarch64-pc-windows-msvc
            bundles: nsis # the MSI builder (WiX 3) cannot make ARM installers
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Version for file names
        run: echo "LABEL=$(bash .github/label.sh)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
        working-directory: app
      - run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        working-directory: app
      - run: cargo build --release -p inventario-registro-cli --target ${{ matrix.target }}
      - name: Collect the files
        shell: pwsh
        run: |
          $name = "Registro-de-equipos_$($env:LABEL)_windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item (Get-Item target/${{ matrix.target }}/release/bundle/nsis/*.exe) "dist/$name-setup.exe"
          if ("${{ matrix.arch }}" -eq "x64") { Copy-Item (Get-Item target/${{ matrix.target }}/release/bundle/msi/*.msi) "dist/$name.msi" }
          # the portable version: the app itself, which needs no installing (its page is built into the .exe)
          Copy-Item target/${{ matrix.target }}/release/inventario-registro.exe "dist/$name-portable.exe"
          # it must not carry an installer's mark, or it would update by running an installer instead of replacing itself
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes("dist/$name-portable.exe"))
          if (-not $text.Contains('__TAURI_BUNDLE_TYPE_VAR_UNK')) { throw "The portable .exe is marked as an installer" }
          Compress-Archive -Path target/${{ matrix.target }}/release/inventario-registro-cli.exe -DestinationPath "dist/inventario-registro-cli_$($env:LABEL)_windows-${{ matrix.arch }}.zip"
          Get-ChildItem dist
      - name: Sign the update files
        run: |
          shopt -s nullglob # there is no MSI for ARM
          bash .github/sign.sh dist/Registro-de-equipos_*.exe dist/Registro-de-equipos_*.msi
      - uses: actions/upload-artifact@v7
        with:
          name: signatures-windows-${{ matrix.arch }}
          path: dist/*.sig
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          path: dist/Registro-de-equipos_${{ env.LABEL }}_windows-${{ matrix.arch }}-setup.exe
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: dist/Registro-de-equipos_${{ env.LABEL }}_windows-${{ matrix.arch }}-portable.exe
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: matrix.arch == 'x64'
        with:
          path: dist/Registro-de-equipos_${{ env.LABEL }}_windows-x64.msi
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: dist/inventario-registro-cli_${{ env.LABEL }}_windows-${{ matrix.arch }}.zip
          archive: false
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04 # built on an older system so it also runs on older distributions
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Version for file names
        run: echo "LABEL=$(bash .github/label.sh)" >> "$GITHUB_ENV"
      - name: Libraries the window needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file rpm zip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
        working-directory: app
      - run: npx tauri build --bundles deb,rpm,appimage
        working-directory: app
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
      - run: cargo build --release -p inventario-registro-cli
      - name: Collect the files
        run: |
          name="Registro-de-equipos_${LABEL}_linux-${{ matrix.arch }}"
          mkdir -p dist
          cp target/release/bundle/deb/*.deb "dist/$name.deb"
          cp target/release/bundle/rpm/*.rpm "dist/$name.rpm"
          cp target/release/bundle/appimage/*.AppImage "dist/$name.AppImage"
          chmod +x "dist/$name.AppImage"
          zip -j "dist/inventario-registro-cli_${LABEL}_linux-${{ matrix.arch }}.zip" target/release/inventario-registro-cli
          ls -la dist
      - name: Sign the update files
        run: bash .github/sign.sh "dist/Registro-de-equipos_${LABEL}_linux-${{ matrix.arch }}".{deb,rpm,AppImage}
      - uses: actions/upload-artifact@v7
        with:
          name: signatures-linux-${{ matrix.arch }}
          path: dist/*.sig
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          path: dist/Registro-de-equipos_${{ env.LABEL }}_linux-${{ matrix.arch }}.deb
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: dist/Registro-de-equipos_${{ env.LABEL }}_linux-${{ matrix.arch }}.rpm
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: dist/Registro-de-equipos_${{ env.LABEL }}_linux-${{ matrix.arch }}.AppImage
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: dist/inventario-registro-cli_${{ env.LABEL }}_linux-${{ matrix.arch }}.zip
          archive: false
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches the app's version
        run: |
          # the app compares its own version with latest.json's: they must be the same number, or it would keep
          # offering the update it already has
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          [[ "${GITHUB_REF_NAME}" == "v${version}" ]] || { echo "::error::Tag ${GITHUB_REF_NAME} but Cargo.toml says ${version}"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: latest.json, for the app's updater
        run: |
          python3 .github/latest_json.py dist "${GITHUB_REF_NAME#v}" "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          mkdir -p signatures && mv dist/*.sig signatures/ # inside latest.json; not needed as files
      - run: find dist -type f | sort
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: dist/**/*
