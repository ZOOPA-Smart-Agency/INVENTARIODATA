# Tests and builds the app and the command-line tool for every system on every push, and keeps the files as the
# run's artifacts. Pushing a tag such as v0.1.0 also attaches them to a DRAFT release, published by hand on GitHub.
# Nothing here signs the apps (see README.md, "Unsigned builds").
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # in file names: the tag for releases, otherwise the run number (branch names can contain "/")
  LABEL: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p inventario-core
      - name: What this runner reports about itself
        run: cargo run -q -p inventario-registro-cli -- --dry-run

  macos:
    name: macOS (universal)
    needs: test
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: app
      - run: npx tauri build --target universal-apple-darwin --bundles app,dmg
        working-directory: app
      - name: Command-line tool (Intel + Apple silicon)
        run: |
          cargo build --release -p inventario-registro-cli --target aarch64-apple-darwin
          cargo build --release -p inventario-registro-cli --target x86_64-apple-darwin
          mkdir -p out
          lipo -create -output out/inventario-registro-cli target/aarch64-apple-darwin/release/inventario-registro-cli target/x86_64-apple-darwin/release/inventario-registro-cli
          cd out && zip -q "inventario-registro-cli-${LABEL}-macos-universal.zip" inventario-registro-cli
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: macos
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            out/*.zip

  windows:
    name: Windows (${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - arch: arm64
            target: aarch64-pc-windows-msvc
            bundles: nsis # the MSI builder (WiX 3) cannot make ARM installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: app
      - run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        working-directory: app
      - name: Command-line tool
        shell: pwsh
        run: |
          cargo build --release -p inventario-registro-cli --target ${{ matrix.target }}
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path target/${{ matrix.target }}/release/inventario-registro-cli.exe -DestinationPath "out/inventario-registro-cli-$env:LABEL-windows-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: windows-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            out/*.zip

  linux:
    name: Linux (${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04 # built on an older system so it also runs on older distributions
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Libraries the window needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file rpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: app
      - run: npx tauri build --bundles deb,rpm,appimage
        working-directory: app
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
      - name: Command-line tool
        run: |
          cargo build --release -p inventario-registro-cli
          mkdir -p out
          tar -czf "out/inventario-registro-cli-${LABEL}-linux-${{ matrix.arch }}.tar.gz" -C target/release inventario-registro-cli
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: linux-${{ matrix.arch }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            out/*.tar.gz

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: find dist -type f | sort
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/**/*
